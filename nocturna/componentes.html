<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit de componentes · Rueda Nocturna</title>

  <!-- Fuentes de marca (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS generado por Tailwind -->
  <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-crema font-texto text-azul-noche dark:bg-azul-noche dark:text-crema">
  <main class="mx-auto max-w-3xl space-y-12 px-6 py-12">

    <h1 class="font-titulos text-3xl font-bold text-azul-noche dark:text-amarillo-farol">Kit de componentes · Rueda Nocturna v0.1</h1>

    <!-- Botones -->
    <section class="space-y-4">
      <h2 class="font-titulos text-2xl font-bold">Botones</h2>
      <div class="flex flex-wrap gap-4">
        <button class="rounded-lg bg-verde-ruta px-6 py-3 font-semibold text-white hover:bg-naranja-pedal hover:text-azul-noche focus:outline-hidden focus:ring-4 focus:ring-amarillo-farol">Principal</button>
        <button class="rounded-lg bg-naranja-pedal px-6 py-3 font-semibold text-azul-noche hover:bg-amarillo-farol focus:outline-hidden focus:ring-4 focus:ring-verde-ruta">Secundario</button>
        <button class="rounded-lg border-2 border-verde-ruta px-6 py-3 font-semibold text-verde-ruta hover:bg-verde-ruta hover:text-white focus:outline-hidden focus:ring-4 focus:ring-amarillo-farol dark:border-amarillo-farol dark:text-amarillo-farol dark:hover:bg-amarillo-farol dark:hover:text-azul-noche">Contorno</button>
      </div>
    </section>

    <!-- Card -->
    <section class="space-y-4">
      <h2 class="font-titulos text-2xl font-bold">Card</h2>
      <article class="overflow-hidden rounded-2xl border-2 border-gris-asfalto bg-white shadow-lg dark:border-naranja-pedal dark:bg-azul-noche">
        <img src="../img/ruta.jpeg" alt="Ciclistas en una ruta nocturna" class="h-64 w-full object-cover object-center">
        <div class="space-y-4 p-6">
          <span class="inline-block rounded-full bg-verde-ruta px-3 py-1 text-sm font-semibold text-white">Nivel fácil</span>
          <h3 class="font-titulos text-xl font-bold text-azul-noche dark:text-crema">Luces del Centro</h3>
          <p>10 km · 2 h · $55.000</p>
        </div>
      </article>
    </section>

    <!-- Alertas -->
    <section class="space-y-4">
      <h2 class="font-titulos text-2xl font-bold">Alertas</h2>
      <div class="rounded-lg border-l-4 border-azul-noche bg-white p-4 dark:border-crema dark:bg-azul-noche">
        Información: tu cupo está reservado por 24 horas.
      </div>
      <div role="status" class="rounded-lg border-l-4 border-amarillo-farol bg-verde-ruta p-4 text-white">
        Éxito: tu inscripción fue recibida.
      </div>
      <div class="rounded-lg border-l-4 border-naranja-pedal bg-amarillo-farol p-4 text-azul-noche">
        Advertencia: quedan pocos cupos para esta salida.
      </div>
    </section>

    <!-- Formulario -->
    <section class="space-y-4">
      <h2 class="font-titulos text-2xl font-bold">Formulario</h2>
      <div>
        <label for="correo" class="mb-1 block font-semibold">Correo</label>
        <input id="correo" type="email" class="w-full rounded-lg border border-gris-asfalto bg-white px-6 py-3 text-azul-noche focus:outline-hidden focus:ring-4 focus:ring-amarillo-farol dark:border-naranja-pedal dark:bg-azul-noche dark:text-crema">
      </div>
      <div>
        <label for="celular" class="mb-1 block font-semibold">Celular</label>
        <input id="celular" type="tel" class="w-full rounded-lg border border-gris-asfalto bg-white px-6 py-3 text-azul-noche focus:outline-hidden focus:ring-4 focus:ring-amarillo-farol dark:border-naranja-pedal dark:bg-azul-noche dark:text-crema">
      </div>
    </section>

  </main>
</body>
</html>
